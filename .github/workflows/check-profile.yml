name: Check M8 Profile

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler@4.123.0

      - name: Check profile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "===== M8 PROFILE ====="
          wrangler d1 execute m8-database --remote --command \
          "SELECT id,name,profile_photo_url,profile_background_url FROM users WHERE id=10;"
