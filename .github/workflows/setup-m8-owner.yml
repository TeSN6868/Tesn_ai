name: Setup M8 Owner

on:
  workflow_dispatch:

jobs:
  setup-owner:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Setup Owner Account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          M8_OWNER_PASSWORD: ${{ secrets.M8_OWNER_PASSWORD }}
        run: |
          node <<'NODE'
          const crypto = require('crypto');
          const { execFileSync } = require('child_process');

          const password = process.env.M8_OWNER_PASSWORD;

          if (!password) {
            throw new Error('M8_OWNER_PASSWORD belum diset.');
          }

          function hashPassword(password) {
            const iterations = 100000;
            const salt = crypto.randomBytes(16).toString('base64');

            const derived = crypto.pbkdf2Sync(
              Buffer.from(password, 'utf8'),
              Buffer.from(salt, 'utf8'),
              iterations,
              32,
              'sha256'
            );

            return `pbkdf2$${iterations}$${salt}$${derived.toString('base64')}`;
          }

          const hash = hashPassword(password);
          const safeHash = hash.replace(/'/g, "''");

          const sql = `
          ALTER TABLE users ADD COLUMN role TEXT NOT NULL DEFAULT 'user';

          UPDATE users
          SET
            name = 'M8 Owner',
            password_hash = '${safeHash}',
            role = 'owner'
          WHERE m8_pin = 'M8000001';

          INSERT INTO users
            (m8_pin, name, email, phone, password_hash, created_at, role)
          SELECT
            'M8000001',
            'M8 Owner',
            NULL,
            NULL,
            '${safeHash}',
            unixepoch(),
            'owner'
          WHERE NOT EXISTS (
            SELECT 1 FROM users WHERE m8_pin = 'M8000001'
          );
          `;

          execFileSync(
            'npx',
            [
              'wrangler',
              'd1',
              'execute',
              'm8-database',
              '--remote',
              '--command',
              sql
            ],
            {
              stdio: 'inherit',
              env: process.env
            }
          );

          console.log('M8 Owner berhasil dipatenkan.');
          NODE
