name: Inspect Users And Migrations

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.125.0

      - name: Inspect users schema
        run: |
          ./node_modules/.bin/wrangler d1 execute m8-database --remote \
            --command="PRAGMA table_info(users);"

      - name: Inspect migrations
        run: |
          ./node_modules/.bin/wrangler d1 execute m8-database --remote \
            --command="SELECT * FROM d1_migrations ORDER BY id;"
