name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - bjo-rescue
    paths:
      - 'worker/**'
      - 'migrations/**'
      - 'wrangler.toml'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Check D1 migration state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 execute m8-database --remote --config wrangler.toml --command "SELECT * FROM d1_migrations ORDER BY id;"
          
      - name: Repair existing D1 migration state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 execute m8-database --remote --config wrangler.toml --command "INSERT INTO d1_migrations (name) SELECT '0003_add_session_expires_at.sql' WHERE NOT EXISTS (SELECT 1 FROM d1_migrations WHERE name = '0003_add_session_expires_at.sql');"

          wrangler d1 execute m8-database --remote --config wrangler.toml --command "SELECT * FROM d1_migrations ORDER BY id;"

      - name: Run D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 migrations apply m8-database --remote --config wrangler.toml

      - name: Deploy Worker
        run: wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
