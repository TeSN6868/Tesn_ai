name: Set M8 User Active Status

on:
  workflow_dispatch:

jobs:
  set-active:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Add active column
        run: |
          wrangler d1 execute m8-database --remote --command "ALTER TABLE users ADD COLUMN active INTEGER NOT NULL DEFAULT 0;"

      - name: Activate owner and active users
        run: |
          wrangler d1 execute m8-database --remote --command "UPDATE users SET active = CASE WHEN id IN (6,7,10) THEN 1 ELSE 0 END;"

      - name: Verify
        run: |
          echo "===== USER ACTIVE STATUS ====="
          wrangler d1 execute m8-database --remote --command "SELECT id, name, m8_pin, role, active FROM users ORDER BY id;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
