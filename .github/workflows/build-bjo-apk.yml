name: Build BJo APK

on:
  push:
    branches:
      - bjo-development
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build BJo Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout BJo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Build BJo Release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          echo "===== BJO APK ====="
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "BJo APK BUILD BERHASIL"

      - name: Upload BJo Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BJo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
