name: Read BJo Users

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Read users
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "===== BJO USERS ====="
          wrangler d1 execute m8-database --remote --command \
          "SELECT id, name, email, phone, m8_pin, role, active FROM users ORDER BY id;"
