name: Mark Existing D1 Migrations

on:
  workflow_dispatch:

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install -g wrangler@4.124.0

      - name: Mark migrations already applied
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 execute m8-database --remote --config wrangler.toml \
            --command "INSERT INTO d1_migrations (name) SELECT '0002_add_profile_background.sql' WHERE NOT EXISTS (SELECT 1 FROM d1_migrations WHERE name = '0002_add_profile_background.sql'); INSERT INTO d1_migrations (name) SELECT '0003_add_session_expires_at.sql' WHERE NOT EXISTS (SELECT 1 FROM d1_migrations WHERE name = '0003_add_session_expires_at.sql');"

          wrangler d1 execute m8-database --remote --config wrangler.toml \
            --command "SELECT * FROM d1_migrations ORDER BY id;"
