name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - bhre

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: |
          for i in 1 2 3 4 5; do
            echo "=== Gradle build attempt $i/5 ==="
            flutter build apk --release && exit 0
            echo "Build failed; waiting before retry..."
            sleep $((i * 20))
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BVIA-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
