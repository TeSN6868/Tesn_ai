name: Check BJo R2

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g wrangler@4.123.0

      - name: Check R2 object
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler r2 object get \
            m8-messenger-media/messages/1787581900211-af192eba-1f10-4b5c-ac91-bd1510d1bf8f.jpg \
            --remote \
            --file /tmp/test.jpg

          ls -lh /tmp/test.jpg
