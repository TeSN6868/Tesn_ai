name: Check BJo D1

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Check D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "===== D1 LIST ====="
          npx wrangler d1 list

          echo "===== TABLES ====="
          npx wrangler d1 execute m8-database --remote --command \
          "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"

          echo "===== USERS TABLE ====="
          npx wrangler d1 execute m8-database --remote --command \
          "SELECT name FROM sqlite_master WHERE type='table' AND name='users';"

          echo "===== DIAGNOSTIC USER ====="
          npx wrangler d1 execute m8-database --remote --command \
          "SELECT id, m8_pin, length(password_hash) AS hash_length, substr(password_hash,1,20) AS hash_prefix FROM users WHERE m8_pin='diag0001';"
