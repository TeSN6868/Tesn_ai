name: Check M8 Release Keystore

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check release keystore
        env:
          M8_KEYSTORE_BASE64: ${{ secrets.M8_KEYSTORE_BASE64 }}
          M8_KEYSTORE_PASSWORD: ${{ secrets.M8_KEYSTORE_PASSWORD }}
        run: echo "$M8_KEYSTORE_BASE64" | base64 --decode > m8-release.p12 && file m8-release.p12 && keytool -list -storetype PKCS12 -keystore m8-release.p12 -storepass "$M8_KEYSTORE_PASSWORD" -alias m8 >/dev/null && echo "KEYSTORE_PASSWORD_OK" && echo "ALIAS_M8_OK"
