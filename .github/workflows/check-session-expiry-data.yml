name: Check Session Expiry Data

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Check session expiry data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 execute m8-database --remote --config wrangler.toml \
            --command "SELECT COUNT(*) AS total_sessions, COUNT(expires_at) AS sessions_with_expires_at, COUNT(*) - COUNT(expires_at) AS sessions_without_expires_at FROM sessions;"
