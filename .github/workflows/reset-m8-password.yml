name: Reset M8 Password

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Reset password TEST1234
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESET_PASSWORD: ${{ secrets.M8_RESET_PASSWORD }}
        run: |
          node <<'NODE'
          const crypto = require('crypto');
          const { execFileSync } = require('child_process');

          const password = process.env.RESET_PASSWORD;

          if (!password) {
            throw new Error('M8_RESET_PASSWORD belum diset.');
          }

          function hashPassword(password) {
            const iterations = 100000;
            const salt = crypto.randomBytes(16).toString('base64');

            const derived = crypto.pbkdf2Sync(
              Buffer.from(password, 'utf8'),
              Buffer.from(salt, 'utf8'),
              iterations,
              32,
              'sha256'
            );

            return `pbkdf2$${iterations}$${salt}$${derived.toString('base64')}`;
          }

          const hash = hashPassword(password);

          const sql = `
            UPDATE users
            SET password_hash = '${hash.replace(/'/g, "''")}'
            WHERE m8_pin = 'TEST1234'
          `;

          execFileSync(
            'npx',
            [
              'wrangler',
              'd1',
              'execute',
              'm8-database',
              '--remote',
              '--command',
              sql
            ],
            {
              stdio: 'inherit',
              env: process.env
            }
          );

          console.log('Password akun TEST1234 berhasil di-reset.');
          NODE
