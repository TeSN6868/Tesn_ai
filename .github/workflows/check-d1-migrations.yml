name: Check M8 D1 Migrations

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Check migration history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "===== D1 MIGRATIONS ====="
          wrangler d1 execute m8-database --remote --config wrangler.toml \
            --command "SELECT * FROM d1_migrations ORDER BY id;"

          echo
          echo "===== USERS SCHEMA ====="
          wrangler d1 execute m8-database --remote --config wrangler.toml \
            --command "PRAGMA table_info(users);"

          echo
          echo "===== SESSIONS SCHEMA ====="
          wrangler d1 execute m8-database --remote --config wrangler.toml \
            --command "PRAGMA table_info(sessions);"
