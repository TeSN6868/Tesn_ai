name: Fix BJo PIN

on:
  workflow_dispatch:

jobs:
  fix-pin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler@4.123.0

      - name: Fix PIN in D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BJO_OWNER_PIN: ${{ secrets.BJO_OWNER_PIN }}
        run: |
          npx wrangler d1 execute m8-database --remote --command \
          "UPDATE users SET m8_pin = '$BJO_OWNER_PIN', name = 'beeee', role = 'owner', active = 1 WHERE id = 10;"

      - name: Verify account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute m8-database --remote --command \
          "SELECT id, name, email, phone, role, active FROM users WHERE id = 10;"
