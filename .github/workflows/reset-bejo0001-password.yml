name: Reset Password BJo bejo0001

on:
  workflow_dispatch:

jobs:
  reset-password:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reset password akun bejo0001
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > /tmp/reset-password.mjs <<'JS'
          import crypto from "node:crypto";

          const password = "Ayie@2026";
          const iterations = 100000;
          const salt = crypto.randomBytes(16);

          const derivedKey = crypto.pbkdf2Sync(
            password,
            salt,
            iterations,
            32,
            "sha256"
          );

          const hash =
            `pbkdf2$${iterations}$` +
            `${salt.toString("base64")}$` +
            `${derivedKey.toString("base64")}`;

          process.stdout.write(hash);
          JS

          PASSWORD_HASH="$(node /tmp/reset-password.mjs)"

          echo "===== CHECK ACCOUNT ====="

          npx wrangler@4.123.0 d1 execute m8-database --remote --command \
          "SELECT id,m8_pin,name,email,phone,active FROM users WHERE m8_pin='bejo0001';"

          echo "===== RESET PASSWORD ====="

          npx wrangler@4.123.0 d1 execute m8-database --remote --command \
          "UPDATE users SET password_hash='${PASSWORD_HASH}', active=1 WHERE m8_pin='bejo0001';"

          echo "===== VERIFY ACCOUNT ====="

          npx wrangler@4.123.0 d1 execute m8-database --remote --command \
          "SELECT id,m8_pin,name,email,phone,active,LENGTH(password_hash) AS hash_length FROM users WHERE m8_pin='bejo0001';"
